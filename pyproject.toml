[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-transport-core"
version = "0.1.0"
description = "Persistent transport telemetry and external prediction API integration"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx2>=2.13,<3", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["services/backend/src", "services/processing-worker/src", "services/telemetry-gateway/src", "packages/contracts/src", "packages/storage/src"]
include = ["backend*", "processing_worker*", "telemetry_gateway*", "transport_contracts*", "transport_storage*"]

[tool.pytest.ini_options]
pythonpath = ["services/backend/src", "services/processing-worker/src", "services/telemetry-gateway/src", "packages/contracts/src", "packages/storage/src"]
testpaths = ["tests", "services/telemetry-gateway/tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
